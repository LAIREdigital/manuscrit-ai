<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAIRE Toolkit</title>
  <meta name="description" content="The tools the LAIRE team builds and uses.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#3D3642">
  <link rel="icon" type="image/png" href="toolkit/img/a-mark.png">
  <link rel="preload" href="toolkit/fonts/cormorant.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="toolkit/fonts/lato-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="toolkit/toolkit.css">
</head>
<body class="locked">
  <!-- Coastal scallops: four layered waves (Seafoam, Tidewater, Sea Glass, Harbor), each offset half a bump -->

    <symbol id="scallops" viewBox="0 0 1920 160" preserveAspectRatio="xMidYMax slice">

      <path fill="#8BD8D5" d="M-144 88 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 L2112 160 L-144 160Z"/>
      <path fill="#5BB8A6" d="M-96 126 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 L2112 160 L-96 160Z"/>
      <path fill="#4A93B0" d="M-144 163 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 a48 48 0 0 1 96 0 L2112 160 L-144 160Z"/>
    </symbol>
  </svg>

  <div id="pin-screen" class="pin-screen">
    <main class="pin-main">
      <form id="pin-form" class="pin-card" autocomplete="off">
        <img class="logo" src="toolkit/img/laire-wordmark-white.png" alt="LAIRE">
        <p class="eyebrow">Toolkit</p>
        <h1 class="display">Team tools, one place</h1>
        <label for="pin">Enter the team PIN</label>
        <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" required autofocus>
        <p class="pin-error" id="pin-error" role="alert"></p>
        <button class="btn btn-dune">Open the toolkit</button>
      </form>
    </main>
    <svg class="scallops" aria-hidden="true"><use href="#scallops"/></svg>
  </div>

  <div id="app" hidden>
    <header class="masthead">
      <div class="wrap top">
        <a class="brand" href="./">
          <img src="toolkit/img/laire-wordmark-white.png" alt="LAIRE">
          <span class="eyebrow">Toolkit</span>
        </a>
        <button class="btn btn-outline-light" id="lock">Lock</button>
      </div>
      <section class="wrap hero">
        <p class="eyebrow">Made at LAIRE</p>
        <h1 class="display">Tools that do the busywork</h1>
        <p>Everything we've built to work faster for clients and for ourselves. Pick one and get going.</p>
      </section>
      <svg class="scallops" aria-hidden="true" style="background:var(--laire-midnight)"><use href="#scallops"/></svg>
    </header>

    <main>
      <div class="wrap toolbar">
        <p class="eyebrow" id="count"></p>
        <div class="filters" role="group" aria-label="Filter tools">
          <button class="chip on" data-filter="all">All</button>
          <button class="chip" data-filter="live">Live</button>
          <button class="chip" data-filter="slack">In Slack</button>
          <button class="chip" data-filter="soon">Coming soon</button>
        </div>
      </div>
      <section id="grid" class="wrap grid" aria-live="polite"></section>
    </main>

    <footer class="site-foot">
      <div class="wrap">
        <img src="toolkit/img/a-mark.png" alt="">
        <p><strong>LAIRE Leads to Growth&reg;</strong> Each tool keeps its own sign-in and its own data.</p>
      </div>
    </footer>
  </div>

  <script type="module" src="toolkit/toolkit.js"></script>
</body>
</html>
