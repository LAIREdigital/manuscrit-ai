<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAIRE Toolkit</title>
  <meta name="description" content="The tools LAIRE Digital builds and uses.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233d3642'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23ff8b71'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="toolkit/toolkit.css">
</head>
<body class="locked">
  <div id="pin-screen" class="pin-screen">
    <form id="pin-form" class="pin-card" autocomplete="off">
      <p class="wordmark">LAIRE <span>Toolkit</span></p>
      <label for="pin">Enter the team PIN</label>
      <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" required autofocus>
      <p class="pin-error" id="pin-error" role="alert"></p>
      <button class="btn-primary">Open toolkit</button>
    </form>
  </div>

  <div id="app" hidden>
    <header class="top">
      <div class="wrap top-inner">
        <p class="wordmark">LAIRE <span>Toolkit</span></p>
        <button class="btn-ghost" id="lock">Lock</button>
      </div>
    </header>

    <main class="wrap">
      <section class="hero">
        <h1>Tools built by the LAIRE team</h1>
        <p>Everything we have made to work faster for clients and for ourselves, in one place.</p>
      </section>

      <div class="filters" role="group" aria-label="Filter tools">
        <button class="chip on" data-filter="all">All</button>
        <button class="chip" data-filter="live">Live</button>
        <button class="chip" data-filter="slack">In Slack</button>
        <button class="chip" data-filter="soon">Coming soon</button>
      </div>

      <section id="grid" class="grid" aria-live="polite"></section>
    </main>

    <footer class="wrap foot">
      <p>LAIRE Digital. Each tool keeps its own sign-in and its own data.</p>
    </footer>
  </div>

  <script type="module" src="toolkit/toolkit.js"></script>
</body>
</html>
